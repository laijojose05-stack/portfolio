<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="dark">
  <title>Page Not Found | Laijo Jose</title>
  <meta name="description" content="The page you are looking for could not be found. Return to the Laijo Jose portfolio homepage.">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <svg class="icon-sprite" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
    <symbol id="i-arrow-right" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></symbol>
    <symbol id="i-mail" viewBox="0 0 24 24"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></symbol>
  </svg>

  <div class="error-page">
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="/" aria-label="Laijo Jose - portfolio home">
          <span class="brand__mark" aria-hidden="true">LJ</span>
          <span class="brand__name">Laijo Jose</span>
        </a>
      </div>
    </header>

    <main class="error-page-main">
      <div class="shell">
        <div class="error-card">
          <p class="error-code" aria-hidden="true">404</p>
          <p class="mono accent">Page not found</p>
          <h1 class="error-title">This page could not be found.</h1>
          <p class="error-text">The page you are looking for may have moved or does not exist. Let&rsquo;s get you back to the portfolio.</p>
          <div class="error-actions">
            <a class="button button--solid" href="/">
              Back to home
              <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-arrow-right"></use></svg>
            </a>
            <a class="button button--outline" href="mailto:laijojose05@gmail.com">
              <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-mail"></use></svg>
              Email Laijo
            </a>
          </div>
        </div>
      </div>
    </main>

    <footer class="error-footer">
      <div class="shell">
        <p>Laijo Jose &middot; Student Developer &middot; Kollam, Kerala, India</p>
      </div>
    </footer>
  </div>
</body>
</html>
